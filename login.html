<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/brand.css">
<style>
  .wrap{ max-width:380px; margin:12vh auto; padding:0 20px; }
  h1{ font-size:20px; margin-bottom:4px; }
  .sub{ color:var(--brand-muted); font-size:13px; margin-bottom:24px; }
  .field{ margin-bottom:14px; }
  label{ display:block; font-size:12px; color:var(--brand-muted); margin-bottom:6px; }
  .switch{ margin-top:16px; font-size:13px; color:var(--brand-muted); }
  .switch a{ cursor:pointer; }
  .msg{ font-size:13px; margin-top:14px; min-height:18px; }
  .msg.error{ color:var(--brand-danger); }
  .msg.ok{ color:var(--brand-accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-card">
    <h1 id="formTitle">Log in</h1>
    <p class="sub" id="formSub">One account works across the whole site.</p>

    <div class="field">
      <label>Email</label>
      <input class="brand-input" type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="brand-input" type="password" id="password" placeholder="••••••••">
    </div>

    <button class="brand-btn" id="submitBtn" style="width:100%;">Log in</button>
    <div class="msg" id="msg"></div>

    <div class="switch">
      <span id="switchText">Don't have an account? <a id="switchLink">Sign up</a></span>
    </div>
  </div>
</div>

<script src="shared/auth.js"></script>
<script>
  let mode = "login"; // or "signup"
  const submitBtn = document.getElementById('submitBtn');
  const switchLink = document.getElementById('switchLink');
  const formTitle = document.getElementById('formTitle');
  const switchText = document.getElementById('switchText');
  const msg = document.getElementById('msg');

  switchLink.addEventListener('click', ()=>{
    mode = mode === "login" ? "signup" : "login";
    formTitle.textContent = mode === "login" ? "Log in" : "Create account";
    submitBtn.textContent = mode === "login" ? "Log in" : "Sign up";
    switchText.innerHTML = mode === "login"
      ? 'Don\'t have an account? <a id="switchLink">Sign up</a>'
      : 'Already have an account? <a id="switchLink">Log in</a>';
    document.getElementById('switchLink').addEventListener('click', arguments.callee);
    msg.textContent = "";
  });

  submitBtn.addEventListener('click', async ()=>{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    msg.className = "msg";
    msg.textContent = "Working…";
    try{
      if(mode === "login"){
        await signIn(email, password);
      } else {
        await signUp(email, password);
        msg.className = "msg ok";
        msg.textContent = "Account created — check your email to confirm, then log in.";
        return;
      }
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('next') || '/task-studio/index.html';
    } catch(err){
      msg.className = "msg error";
      msg.textContent = err.message || "Something went wrong.";
    }
  });
</script>
</body>
</html>
