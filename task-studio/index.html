<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Studio</title>
<link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="ts-wrap">

  <div class="ts-topbar">
    <div>
      <img src="../assets/logo-mark.svg" height="30" alt="Task Studio" style="border-radius:7px;margin-bottom:6px;">
      <p style="color:var(--brand-muted);font-size:13px;margin:0;">One tab per task, each with its own tailored prompt.</p>
    </div>
    <div class="who">
      <span id="whoEmail"></span>
      <a id="adminLink" href="admin.html" style="display:none;">Admin</a>
      <a id="logoutLink" href="#">Log out</a>
    </div>
  </div>

  <div class="ts-pipeline" id="pipeline">
    <div class="step" data-step="0"><span class="dot"></span>Prompt loaded</div>
    <span class="arrow">→</span>
    <div class="step" data-step="1"><span class="dot"></span>Model called</div>
    <span class="arrow">→</span>
    <div class="step" data-step="2"><span class="dot"></span>Result</div>
  </div>

  <div class="ts-tabs" id="tabsBar"></div>
  <div id="panelHost"></div>

</div>

<script src="../shared/auth.js"></script>
<script>
let tasks = [];
let activeIndex = 0;
let userIsAdmin = false;

async function init(){
  const user = await requireLogin("../login.html");
  if(!user) return;
  document.getElementById('whoEmail').textContent = user.email;
  document.getElementById('logoutLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    await signOut();
    window.location.href = "../login.html";
  });
  if(await isAdmin()){
    document.getElementById('adminLink').style.display = 'inline';
    userIsAdmin = true;
  }

  const { data, error } = await supabaseClient
    .from('task_meta')
    .select('*')
    .order('sort_order', { ascending: true });

  if(error){
    document.getElementById('panelHost').textContent = "Couldn't load tasks: " + error.message;
    return;
  }
  tasks = data;
  renderTabs();
  renderPanel(0);
}

function renderTabs(){
  const bar = document.getElementById('tabsBar');
  bar.innerHTML = '';
  tasks.forEach((t, i)=>{
    const tab = document.createElement('div');
    tab.className = 'ts-tab' + (i===activeIndex ? ' active' : '');
    tab.textContent = t.label;
    tab.addEventListener('click', ()=>{ activeIndex = i; renderTabs(); renderPanel(i); });
    bar.appendChild(tab);
  });
}

function resetPipeline(){
  document.querySelectorAll('.ts-pipeline .step').forEach(s=>s.classList.remove('active','done'));
}
function setPipeline(stage){
  document.querySelectorAll('.ts-pipeline .step').forEach((s,i)=>{
    s.classList.remove('active','done');
    if(i<stage) s.classList.add('done');
    if(i===stage) s.classList.add('active');
  });
}
function finishPipeline(){
  document.querySelectorAll('.ts-pipeline .step').forEach(s=>{ s.classList.remove('active'); s.classList.add('done'); });
}

function renderPanel(i){
  resetPipeline();
  const task = tasks[i];
  const host = document.getElementById('panelHost');
  host.innerHTML = `
    <div class="brand-card">
      <h2 style="font-size:15px;margin:0 0 4px;">${task.label}</h2>
      <p class="ts-desc">${task.description || ''}</p>
      <div id="taskBody"></div>
    </div>
  `;
  const body = document.getElementById('taskBody');

  if(task.input_type === 'audio'){
    body.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
        <input type="file" id="fileInput" accept="audio/*" multiple>
        <button class="brand-btn" id="runBtn" disabled>Transcribe</button>
      </div>
      <div class="ts-output empty" id="taskOut">Result will appear here.</div>
    `;
    setupAudio(task);
  } else if(task.input_type === 'image'){
    body.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button class="brand-btn" id="runBtn" disabled>Run</button>
      </div>
      <div class="ts-thumbrow" id="thumbRow"></div>
      <div class="ts-output empty" id="taskOut">Result will appear here.</div>
    `;
    setupImage(task);
  } else if(task.input_type === 'video'){
    body.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
        <input type="file" id="fileInput" accept="video/*" multiple>
        <button class="brand-btn" id="runBtn" disabled>Evaluate</button>
      </div>
      <p style="color:var(--brand-muted);font-size:12px;margin:0 0 10px;">Upload two or more to compare them against each other, or just one to evaluate it alone.</p>
      <div class="ts-thumbrow" id="videoPreviews"></div>
      <div class="ts-output empty" id="taskOut">Result will appear here.</div>
    `;
    setupVideo(task);
  } else {
    body.innerHTML = `<p style="color:var(--brand-muted);">Unknown input type: ${task.input_type}</p>`;
  }
}

function setupAudio(task){
  const fileInput = document.getElementById('fileInput');
  const runBtn = document.getElementById('runBtn');
  const out = document.getElementById('taskOut');
  let selectedFiles = [];

  fileInput.addEventListener('change', ()=>{
    selectedFiles = Array.from(fileInput.files);
    runBtn.disabled = selectedFiles.length === 0;
  });

  runBtn.addEventListener('click', async ()=>{
    runBtn.disabled = true;
    runBtn.textContent = "Uploading…";
    setPipeline(0);
    out.classList.add('empty');
    out.textContent = "Uploading files…";
    try{
      const paths = [];
      for(const file of selectedFiles){
        paths.push(await uploadFile(file));
      }
      runBtn.textContent = "Transcribing…";
      out.textContent = "Working…";
      setPipeline(1);
      const result = await callGemini(task.id, paths);
      setPipeline(2);
      out.classList.remove('empty');
      out.innerHTML = '<span class="ts-tag">transcript</span>\n' + result;
    } catch(err){
      out.textContent = "Error: " + err.message;
    } finally {
      finishPipeline();
      runBtn.disabled = false;
      runBtn.textContent = "Transcribe";
    }
  });
}

function setupImage(task){
  const fileInput = document.getElementById('fileInput');
  const runBtn = document.getElementById('runBtn');
  const thumbRow = document.getElementById('thumbRow');
  const out = document.getElementById('taskOut');
  let b64List = [];

  fileInput.addEventListener('change', ()=>{
    const files = Array.from(fileInput.files);
    if(!files.length) return;
    b64List = [];
    thumbRow.innerHTML = '';
    runBtn.disabled = true;

    let loaded = 0;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        b64List.push(reader.result.split(',')[1]);
        const img = document.createElement('img');
        img.src = reader.result;
        thumbRow.appendChild(img);
        loaded++;
        if(loaded === files.length) runBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });
  });

  runBtn.addEventListener('click', async ()=>{
    runBtn.disabled = true;
    runBtn.textContent = "Working…";
    setPipeline(0);
    out.classList.add('empty');
    out.textContent = "Working…";
    try{
      setPipeline(1);
      const result = await callModel(task.id, b64List);
      setPipeline(2);
      out.classList.remove('empty');
      out.innerHTML = '<span class="ts-tag">result</span>\n' + result;
    } catch(err){
      out.textContent = "Error: " + err.message;
    } finally {
      finishPipeline();
      runBtn.disabled = false;
      runBtn.textContent = "Run";
    }
  });
}

function setupVideo(task){
  const fileInput = document.getElementById('fileInput');
  const runBtn = document.getElementById('runBtn');
  const previews = document.getElementById('videoPreviews');
  const out = document.getElementById('taskOut');
  let selectedFiles = [];

  fileInput.addEventListener('change', ()=>{
    selectedFiles = Array.from(fileInput.files);
    previews.innerHTML = '';
    selectedFiles.forEach(file=>{
      const v = document.createElement('video');
      v.src = URL.createObjectURL(file);
      v.controls = true;
      v.style.cssText = 'width:160px;height:100px;border-radius:6px;border:1px solid var(--brand-line);object-fit:cover;';
      previews.appendChild(v);
    });
    out.classList.add('empty');
    out.textContent = 'Result will appear here.';
    runBtn.disabled = selectedFiles.length === 0;
  });

  runBtn.addEventListener('click', async ()=>{
    runBtn.disabled = true;
    runBtn.textContent = "Uploading…";
    setPipeline(0);
    out.classList.add('empty');
    out.textContent = "Uploading files…";
    try{
      const paths = [];
      for(const file of selectedFiles){
        paths.push(await uploadFile(file));
      }
      runBtn.textContent = "Evaluating…";
      out.textContent = "Working…";
      setPipeline(1);
      const result = await callGemini(task.id, paths);
      setPipeline(2);
      out.classList.remove('empty');
      out.innerHTML = '<span class="ts-tag">evaluation</span>\n' + result;
    } catch(err){
      out.textContent = "Error: " + err.message;
    } finally {
      finishPipeline();
      runBtn.disabled = false;
      runBtn.textContent = "Evaluate";
    }
  });
}

init();
</script>
</body>
</html>
