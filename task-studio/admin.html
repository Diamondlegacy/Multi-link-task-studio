<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Studio — Admin</title>
<link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="ts-wrap">

  <div class="ts-topbar">
    <div>
      <img src="../assets/logo-mark.svg" height="30" alt="Task Studio" style="border-radius:7px;margin-bottom:6px;">
      <p style="color:var(--brand-muted);font-size:13px;margin:0;">Edit prompts, add new tasks. Only visible to you.</p>
    </div>
    <div class="who">
      <a href="index.html">Back to Task Studio</a>
    </div>
  </div>

  <div id="taskList"></div>

  <div class="brand-card" style="margin-top:8px;">
    <h2 style="font-size:15px;margin:0 0 14px;">Add a new task</h2>
    <div style="display:grid;gap:10px;max-width:520px;">
      <input class="brand-input" id="newId" placeholder="id, e.g. logo-critique (no spaces)">
      <input class="brand-input" id="newLabel" placeholder="Tab label, e.g. Logo Critique">
      <select class="brand-input" id="newType">
        <option value="image">Image upload</option>
        <option value="audio">Live audio (mic)</option>
        <option value="video">Video upload</option>
      </select>
      <input class="brand-input" id="newDesc" placeholder="Short description shown under the tab title">
      <textarea class="brand-input" id="newPrompt" placeholder="Tailored instructions for this task" style="min-height:80px;"></textarea>
      <button class="brand-btn" id="addBtn" style="width:fit-content;">Add task</button>
      <span class="save-msg" id="addMsg"></span>
    </div>
  </div>

</div>

<script src="../shared/auth.js"></script>
<script>
async function init(){
  const user = await requireAdmin("index.html");
  if(!user) return;
  await loadTasks();

  document.getElementById('addBtn').addEventListener('click', async ()=>{
    const id = document.getElementById('newId').value.trim();
    const label = document.getElementById('newLabel').value.trim();
    const input_type = document.getElementById('newType').value;
    const description = document.getElementById('newDesc').value.trim();
    const prompt = document.getElementById('newPrompt').value.trim();
    const addMsg = document.getElementById('addMsg');

    if(!id || !label || !prompt){
      addMsg.textContent = "id, label, and prompt are required.";
      return;
    }
    const { data: existing } = await supabaseClient.from('tasks').select('sort_order').order('sort_order', {ascending:false}).limit(1);
    const nextOrder = existing && existing[0] ? existing[0].sort_order + 1 : 1;

    const { error } = await supabaseClient.from('tasks').insert({
      id, label, input_type, description, prompt, sort_order: nextOrder
    });
    if(error){
      addMsg.textContent = "Error: " + error.message;
      return;
    }
    addMsg.textContent = "Added — appears as a new tab immediately.";
    document.getElementById('newId').value = '';
    document.getElementById('newLabel').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newPrompt').value = '';
    await loadTasks();
  });
}

async function loadTasks(){
  const { data, error } = await supabaseClient.from('tasks').select('*').order('sort_order', {ascending:true});
  const list = document.getElementById('taskList');
  if(error){ list.textContent = "Couldn't load tasks: " + error.message; return; }

  list.innerHTML = '';
  data.forEach(task=>{
    const row = document.createElement('div');
    row.className = 'ts-task-row';
    row.innerHTML = `
      <h3>${task.label}</h3>
      <div class="meta">id: ${task.id} · type: ${task.input_type}</div>
      <textarea data-id="${task.id}">${task.prompt}</textarea>
      <div class="row-actions">
        <button class="brand-btn save-btn" data-id="${task.id}">Save</button>
        <button class="brand-btn secondary delete-btn" data-id="${task.id}">Delete task</button>
        <span class="save-msg"></span>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.save-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const textarea = list.querySelector(`textarea[data-id="${id}"]`);
      const msgEl = btn.parentElement.querySelector('.save-msg');
      const { error } = await supabaseClient.from('tasks').update({ prompt: textarea.value }).eq('id', id);
      msgEl.textContent = error ? "Error: " + error.message : "Saved.";
    });
  });

  list.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      if(!confirm("Delete this task tab? This can't be undone.")) return;
      const { error } = await supabaseClient.from('tasks').delete().eq('id', id);
      if(error){ alert(error.message); return; }
      await loadTasks();
    });
  });
}

init();
</script>
</body>
</html>
